# Local stack: Prometheus + Grafana + Loki + Promtail (host ports 9203 / 3203 / 3123).
# Start API first: npm run dev (default PORT 3000; monorepo uses PORT=3001 — edit prometheus.yml target if needed).

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: preferences-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9203:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: preferences-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3123:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: preferences-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/preferences:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: preferences-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3203:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
